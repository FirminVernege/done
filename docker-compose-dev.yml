services:
  api:
    build: .
    platform: linux/amd64
    depends_on:
      - postgres
    ports:
      - 8000:8000
    volumes:
      - ./:/usr/src/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    environment:
      - DATABASE_HOSTNAME=postgres
      - DATABASE_PORT = 5432
      - DATABASE_PASSWORD = badlucked1
      - DATABASE_NAME = daone
      - DATABASE_USERNAME = postgres
      - SECRET_KEY = 1776f4c941009b86d4d27ee4ae3e7a0e7532297453aed19defaa2f2473d0eb80
      - ALGORITHM = HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES = 30

  postgres:
    image: postgres:latest
    platform: linux/amd64
    environment:
      - POSTGRES_PASSWORD=badlucked1
      - POSTGRES_DB=daone

    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db:
